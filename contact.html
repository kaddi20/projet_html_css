<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact.css">
  <title>Contact Élan Fitness</title>
</head>
<body>
  <header class="en-tete">
    <div class="conteneur en-tete-contenu">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Logo Élan Fitness ">
      </a>

      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="a-propos.html">À propos</a></li>
          <li><a href="programmes.html">Programmes</a></li>
          <li><a href="contact.html" class="lien-actif">Contactez-nous</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <section id="contact" class="section">
    <div class="conteneur">
      <div class="section-titre">
        <h2>Contactez-nous</h2>
      </div>
      <div>
        <form class="formulaire">
          <div class="form-liste">
            <label for="nom">Nom</label>
            <input type="text" placeholder="entrer votre nom" required>
          </div>
          <div class="form-liste">
            <label for="prenom">Prenom</label>
            <input type="text" placeholder="entrer votre prénom" required>
          </div>
          <div class="form-liste">
            <label for="email">Email</label>
            <input type="email" name="email" placeholder="entrer votre email" required>
          </div>
          <div class="form-liste">
            <label for="telephone">Téléphone</label>
            <input type="tel" name="telephone" placeholder="entrer votre numéro" required>
          </div>
          <div class="form-liste">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="entrer votre message" required></textarea>
          </div>
          <button type="submit">Envoyer</button>
        </form>

      </div>
    </div>
  </section>
  <footer class="pied-de-page">
    <div class="conteneur">

      <div class="pied-haut">

        <div>
          <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Logo Élan Fitness ">
      </a>
          <p class="slogan">Ton énergie, ton rythme.</p>
        </div>

        <nav aria-label="Navigation du pied de page">
          <ul class="menu menu-pied">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="a-propos.html">À propos</a></li>
            <li><a href="programmes.html">Programmes</a></li>
            <li><a href="contact.html" class="lien-actif">Contactez-nous</a></li>
          </ul>
        </nav>
      </div>
      <div class="pied-bas">
        <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
        <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
      </div>

    </div>
  </footer>

</body>

</html>
